name: New NanaZip release

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      recreate_closed:
        description: 'Open a new pull request even if the previous one for this version was closed'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - name: Open a pull request if a new stable release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECREATE_CLOSED: ${{ inputs.recreate_closed }}
        run: ./.github/scripts/check-release.ps1
